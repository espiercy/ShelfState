name: "ShelfState V4 production identity proof"
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact lowercase 40-character candidate SHA on main"
        type: "string"
        required: true
permissions:
  contents: "read"
concurrency:
  group: "shelfstate-v4-production"
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
    if: "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch'"
    env:
      RELEASE_ENVIRONMENT: "production"
      CANDIDATE_SHA: "${{ inputs.commit_sha }}"
    outputs:
      payloadId: "${{ steps.payload.outputs.artifact-id }}"
      evidenceId: "${{ steps.evidence.outputs.artifact-id }}"
      manifestDigest: "${{ steps.seal.outputs.manifestDigest }}"
      candidateSha: "${{ steps.prepare.outputs.candidateSha }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.workflow_sha }}"
          persist-credentials: false
          fetch-depth: 0
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version-file: "v4/.nvmrc"
          package-manager-cache: false
      - name: "Check pinned npm through Corepack"
        working-directory: "v4"
        run: "test \"$(corepack npm --version)\" = \"11.6.2\""
      - name: "Credential-free preparation (audit is mandatory)"
        id: "prepare"
        run: "node v4/scripts/release/controller.mjs prepare"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        id: "payload"
        with:
          name: "candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ steps.prepare.outputs.payloadPath }}"
          retention-days: 90
          overwrite: false
          if-no-files-found: "error"
      - name: "Seal immutable candidate evidence"
        id: "seal"
        env:
          PAYLOAD_ID: "${{ steps.payload.outputs.artifact-id }}"
        run: "node v4/scripts/release/controller.mjs seal"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        id: "evidence"
        with:
          name: "evidence-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ steps.seal.outputs.evidencePath }}"
          retention-days: 90
          overwrite: false
          if-no-files-found: "error"
  proof:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    needs: ["prepare"]
    if: "needs.prepare.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch'"
    environment: "production"
    permissions:
      contents: "read"
      actions: "read"
      id-token: "write"
    env:
      RELEASE_ENVIRONMENT: "production"
      CANDIDATE_SHA: "${{ inputs.commit_sha }}"
      PAYLOAD_ID: "${{ needs.prepare.outputs.payloadId }}"
      EVIDENCE_ID: "${{ needs.prepare.outputs.evidenceId }}"
      MANIFEST_DIGEST: "${{ needs.prepare.outputs.manifestDigest }}"
      SHELFSTATE_AWS_ACCOUNT_ID: "${{ vars.SHELFSTATE_AWS_ACCOUNT_ID }}"
      SHELFSTATE_DEPLOY_ROLE_ARN: "${{ vars.SHELFSTATE_DEPLOY_ROLE_ARN }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.workflow_sha }}"
          persist-credentials: false
          fetch-depth: 0
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version-file: "v4/.nvmrc"
          package-manager-cache: false
      - name: "Authenticate and validate bytes and runtime binding before OIDC"
        id: "binding"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "node v4/scripts/release/controller.mjs pre-oidc"
      - uses: "aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd"
        with:
          role-to-assume: "${{ steps.binding.outputs.roleArn }}"
          aws-region: "us-west-2"
          audience: "sts.amazonaws.com"
          allowed-account-ids: "${{ steps.binding.outputs.accountId }}"
          role-duration-seconds: 900
          role-session-name: "ss-${{ github.run_id }}-${{ github.run_attempt }}"
          mask-aws-account-id: true
          unset-current-credentials: true
          use-existing-credentials: false
          role-chaining: false
          output-credentials: false
          output-env-credentials: true
          translate-env-variables: false
          retry-max-attempts: 2
          action-timeout-s: 120
      - name: "STS identity only; requested duration is not issued lifetime"
        run: "node v4/scripts/release/controller.mjs identity"
